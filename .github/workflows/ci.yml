# O que corre em cada alteração ao SDK.
#
# A ordem não é acidental: os tipos primeiro (é o mais barato), depois os ensaios
# (que incluem a bateria de injeção de falhas do RNF-SDK-01 e a de fuga do
# RNF-PRI-01), depois o empacotamento, e só no fim o orçamento, que precisa do
# pacote construído para o poder pesar.
#
# **Os orçamentos falham a compilação, e não avisam.** Um limite que só avisa é um
# limite que se ultrapassa na terceira semana e ninguém dá por isso.
name: SDK

on:
  push:
    branches: [master]
    # Os minutos do Actions têm teto (plano gratuito, 2 000 por mês, para a organização
    # inteira): um commit só de documentação não corre nada.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

# Um push novo cancela o anterior que ainda esteja a correr: só o último interessa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      # A bateria de fuga corre **em passo próprio e primeiro**, e não só dentro do
      # conjunto. É o RNF-PRI-01, e quando falha tem de se ver que foi ela: uma
      # linha vermelha no meio de cento e trinta ensaios é uma linha que se lê como
      # "os testes falharam", e esta não é um teste como os outros.
      - name: Bateria de fuga de conteúdo
        run: npm run fuga

      - name: Ensaios
        run: npm test

      - name: Empacotar
        run: npm run build

      - name: Orçamento de tamanho e de fio principal
        run: npm run orcamento

      # **A publicação no CDN da sandbox** (ADR 0056), no mesmo job e só no master: o
      # `dist/uxea.js` que esta bateria acabou de aprovar vai para o balde R2
      # `uxea-sdk-sandbox`, servido em https://cdn-sandbox.uxea.io/uxea.js. O endereço da
      # ingestão não vem no ficheiro: quem integra a sandbox escreve
      # `data-servidor="https://ingest-sandbox.uxea.io"`, que é a linha que o painel mostra.
      - name: Publicar no CDN da sandbox
        if: github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_SDK_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SDK_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Cinco minutos de cache: a sandbox muda muitas vezes, e um SDK velho no browser de
          # quem testa é uma tarde perdida a perseguir um defeito que já foi corrigido.
          for f in uxea.js uxea.js.map uxea.mjs uxea.mjs.map; do
            tipo=application/javascript; case "$f" in *.map) tipo=application/json ;; esac
            aws s3 cp "dist/$f" "s3://uxea-sdk-sandbox/$f" --endpoint-url "${{ secrets.R2_SDK_ENDPOINT }}" \
              --content-type "$tipo" --cache-control "public, max-age=300"
          done
          curl -sf -o /tmp/servido.js "https://cdn-sandbox.uxea.io/uxea.js?v=${{ github.sha }}"
          cmp /tmp/servido.js dist/uxea.js && echo "o CDN serve o ficheiro desta bateria"
